naftiko: 1.0.0-alpha2
info:
  label: Google Vertex AI API — Datasets
  description: 'Google Vertex AI API — Datasets. 1 operations. Lead operation: Google Vertex AI List datasets. Self-contained
    Naftiko capability covering one Google Vertex Ai business surface.'
  tags:
  - Google Vertex Ai
  - Datasets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_VERTEX_AI_API_KEY: GOOGLE_VERTEX_AI_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-datasets
    baseUri: https://us-central1-aiplatform.googleapis.com/v1
    description: Google Vertex AI API — Datasets business capability. Self-contained, no shared references.
    resources:
    - name: projects-project-locations-location-datasets
      path: /projects/{project}/locations/{location}/datasets
      operations:
      - name: listdatasets
        method: GET
        description: Google Vertex AI List datasets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.GOOGLE_VERTEX_AI_API_KEY}}'
  exposes:
  - type: rest
    namespace: openapi-datasets-rest
    port: 8080
    description: REST adapter for Google Vertex AI API — Datasets. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/projects/{project}/locations/{location}/datasets
      name: projects-project-locations-location-datasets
      description: REST surface for projects-project-locations-location-datasets.
      operations:
      - method: GET
        name: listdatasets
        description: Google Vertex AI List datasets
        call: openapi-datasets.listdatasets
        with:
          project: rest.project
          location: rest.location
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-datasets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Vertex AI API — Datasets. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: google-vertex-ai-list-datasets
      description: Google Vertex AI List datasets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-datasets.listdatasets
      with:
        project: tools.project
        location: tools.location
      outputParameters:
      - type: object
        mapping: $.

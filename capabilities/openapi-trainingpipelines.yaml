naftiko: 1.0.0-alpha2
info:
  label: Google Vertex AI API — TrainingPipelines
  description: 'Google Vertex AI API — TrainingPipelines. 1 operations. Lead operation: Google Vertex AI List training pipelines.
    Self-contained Naftiko capability covering one Google Vertex Ai business surface.'
  tags:
  - Google Vertex Ai
  - TrainingPipelines
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_VERTEX_AI_API_KEY: GOOGLE_VERTEX_AI_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-trainingpipelines
    baseUri: https://us-central1-aiplatform.googleapis.com/v1
    description: Google Vertex AI API — TrainingPipelines business capability. Self-contained, no shared references.
    resources:
    - name: projects-project-locations-location-trainingPipelines
      path: /projects/{project}/locations/{location}/trainingPipelines
      operations:
      - name: listtrainingpipelines
        method: GET
        description: Google Vertex AI List training pipelines
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.GOOGLE_VERTEX_AI_API_KEY}}'
  exposes:
  - type: rest
    namespace: openapi-trainingpipelines-rest
    port: 8080
    description: REST adapter for Google Vertex AI API — TrainingPipelines. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/projects/{project}/locations/{location}/trainingpipelines
      name: projects-project-locations-location-trainingpipelines
      description: REST surface for projects-project-locations-location-trainingPipelines.
      operations:
      - method: GET
        name: listtrainingpipelines
        description: Google Vertex AI List training pipelines
        call: openapi-trainingpipelines.listtrainingpipelines
        with:
          project: rest.project
          location: rest.location
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-trainingpipelines-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Vertex AI API — TrainingPipelines. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: google-vertex-ai-list-training
      description: Google Vertex AI List training pipelines
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-trainingpipelines.listtrainingpipelines
      with:
        project: tools.project
        location: tools.location
      outputParameters:
      - type: object
        mapping: $.

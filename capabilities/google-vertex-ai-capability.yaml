naftiko: 1.0.0-alpha2
info:
  label: Google Vertex AI API
  description: Provides programmatic access to build, deploy, and manage machine learning models, run predictions, manage
    datasets, and orchestrate ML pipelines on Google Cloud.
  tags:
  - Google
  - Vertex
  - Ai
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-vertex-ai
    baseUri: https://us-central1-aiplatform.googleapis.com/v1
    description: Google Vertex AI API HTTP API.
    authentication:
      type: bearer
      token: '{{GOOGLE_VERTEX_AI_TOKEN}}'
    resources:
    - name: projects-project-locations-location-models
      path: /projects/{project}/locations/{location}/models
      operations:
      - name: listmodels
        method: GET
        description: Google Vertex AI List models
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-locations-location-models-model
      path: /projects/{project}/locations/{location}/models/{model}
      operations:
      - name: getmodel
        method: GET
        description: Google Vertex AI Get a model
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: model
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletemodel
        method: DELETE
        description: Google Vertex AI Delete a model
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: model
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-locations-location-endpoints
      path: /projects/{project}/locations/{location}/endpoints
      operations:
      - name: listendpoints
        method: GET
        description: Google Vertex AI List endpoints
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createendpoint
        method: POST
        description: Google Vertex AI Create an endpoint
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-locations-location-endpoints-en
      path: /projects/{project}/locations/{location}/endpoints/{endpoint}:predict
      operations:
      - name: predict
        method: POST
        description: Google Vertex AI Run a prediction
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: endpoint
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-locations-location-datasets
      path: /projects/{project}/locations/{location}/datasets
      operations:
      - name: listdatasets
        method: GET
        description: Google Vertex AI List datasets
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-locations-location-trainingpipe
      path: /projects/{project}/locations/{location}/trainingPipelines
      operations:
      - name: listtrainingpipelines
        method: GET
        description: Google Vertex AI List training pipelines
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: google-vertex-ai-rest
    description: REST adapter for Google Vertex AI API.
    resources:
    - path: /projects/{project}/locations/{location}/models
      name: listmodels
      operations:
      - method: GET
        name: listmodels
        description: Google Vertex AI List models
        call: google-vertex-ai.listmodels
        with:
          project: rest.project
          location: rest.location
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/locations/{location}/models/{model}
      name: getmodel
      operations:
      - method: GET
        name: getmodel
        description: Google Vertex AI Get a model
        call: google-vertex-ai.getmodel
        with:
          project: rest.project
          location: rest.location
          model: rest.model
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/locations/{location}/models/{model}
      name: deletemodel
      operations:
      - method: DELETE
        name: deletemodel
        description: Google Vertex AI Delete a model
        call: google-vertex-ai.deletemodel
        with:
          project: rest.project

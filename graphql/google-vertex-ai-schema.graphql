  featureVector: [Float]
  restricts: [Namespace]
  numericRestricts: [NumericRestrict]
  crowdingTag: CrowdingTag
}

type Namespace {
  name: String!
  allowList: [String]
  denyList: [String]
}

type NumericRestrict {
  name: String!
  valueInt: Long
  valueFloat: Float
  valueDouble: Float64
  op: NumericRestrictOp
}

type CrowdingTag {
  crowdingAttribute: String!
}

type UpsertDatapointsResponse {
  success: Boolean!
}

type RemoveDatapointsResponse {
  success: Boolean!
}


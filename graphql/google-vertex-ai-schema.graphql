# ---------------------------------------------------------------------------
# Mutation Root
# ---------------------------------------------------------------------------

type Mutation {
  # Datasets
  createDataset(parent: String!, dataset: CreateDatasetInput!): Operation!
  updateDataset(name: ID!, dataset: UpdateDatasetInput!): Dataset!
  deleteDataset(name: ID!): Operation!
  importData(name: ID!, importConfigs: [JSON!]!): Operation!
  exportData(name: ID!, outputConfig: JSON!): Operation!

  # Models
  uploadModel(parent: String!, model: CreateModelInput!): Operation!
  updateModel(name: ID!, model: UpdateModelInput!): Model!
  deleteModel(name: ID!): Operation!
  exportModel(name: ID!, outputConfig: JSON!): Operation!
  copyModel(parent: String!, sourceModel: String!, encryptionSpec: EncryptionSpecInput): Operation!
  mergeVersionAliases(name: ID!, versionAliases: [String!]!): Model!
  deleteModelVersion(name: ID!): Operation!

  # Endpoints
  createEndpoint(parent: String!, endpoint: CreateEndpointInput!, endpointId: String): Operation!
  updateEndpoint(name: ID!, endpoint: UpdateEndpointInput!): Endpoint!
  deleteEndpoint(name: ID!): Operation!
  deployModel(endpoint: String!, deployModel: DeployModelInput!): Operation!
  undeployModel(endpoint: String!, undeployModel: UndeployModelInput!): Operation!
  predict(input: PredictInput!): PredictResponse!
  rawPredict(input: RawPredictInput!): JSON!
  serverStreamingPredict(endpoint: String!, input: JSON!): JSON!

  # Training Pipelines
  createTrainingPipeline(parent: String!, trainingPipeline: CreateTrainingPipelineInput!): TrainingPipeline!
  cancelTrainingPipeline(name: ID!): Boolean!
  deleteTrainingPipeline(name: ID!): Operation!

  # Pipeline Jobs
  createPipelineJob(parent: String!, pipelineJob: CreatePipelineJobInput!, pipelineJobId: String): PipelineJob!
  cancelPipelineJob(name: ID!): Boolean!
  deletePipelineJob(name: ID!): Operation!
  batchDeletePipelineJobs(parent: String!, names: [String!]!): Operation!
  batchCancelPipelineJobs(parent: String!, names: [String!]!): Operation!

  # Batch Prediction
  createBatchPredictionJob(parent: String!, job: CreateBatchPredictionJobInput!): BatchPredictionJob!
  cancelBatchPredictionJob(name: ID!): Boolean!
  deleteBatchPredictionJob(name: ID!): Operation!

  # Custom Jobs
  createCustomJob(parent: String!, job: CreateCustomJobInput!): CustomJob!
  cancelCustomJob(name: ID!): Boolean!
  deleteCustomJob(name: ID!): Operation!

  # Hyperparameter Tuning
  createHyperparameterTuningJob(parent: String!, job: CreateHyperparameterTuningJobInput!): HyperparameterTuningJob!
  cancelHyperparameterTuningJob(name: ID!): Boolean!
  deleteHyperparameterTuningJob(name: ID!): Operation!

  # NAS Jobs
  cancelNasJob(name: ID!): Boolean!
  deleteNasJob(name: ID!): Operation!

  # Feature Store
  createFeaturestore(parent: String!, featurestore: CreateFeaturestoreInput!, featurestoreId: String): Operation!
  updateFeaturestore(name: ID!, featurestore: CreateFeaturestoreInput!): Operation!
  deleteFeaturestore(name: ID!, force: Boolean): Operation!

  createEntityType(parent: String!, entityType: CreateEntityTypeInput!, entityTypeId: String): Operation!
  updateEntityType(name: ID!, entityType: CreateEntityTypeInput!): EntityType!
  deleteEntityType(name: ID!, force: Boolean): Operation!

  createFeature(parent: String!, feature: CreateFeatureInput!, featureId: String!): Operation!
  batchCreateFeatures(parent: String!, requests: [JSON!]!): Operation!
  updateFeature(name: ID!, feature: CreateFeatureInput!): Feature!
  deleteFeature(name: ID!): Operation!
  importFeatureValues(parent: String!, input: ImportFeatureValuesInput!): Operation!
  batchReadFeatureValues(featurestore: String!, input: JSON!): Operation!
  exportFeatureValues(entityType: String!, destination: JSON!, featureSelector: JSON!): Operation!

  createFeatureGroup(parent: String!, featureGroup: CreateFeatureGroupInput!, featureGroupId: String): Operation!
  updateFeatureGroup(name: ID!, featureGroup: CreateFeatureGroupInput!): Operation!
  deleteFeatureGroup(name: ID!, force: Boolean): Operation!

  createFeatureView(parent: String!, featureView: CreateFeatureViewInput!, featureViewId: String): Operation!
  updateFeatureView(name: ID!, featureView: CreateFeatureViewInput!): Operation!
  deleteFeatureView(name: ID!): Operation!
  syncFeatureView(name: ID!): JSON!

  # Indexes
  createIndex(parent: String!, index: CreateIndexInput!): Operation!
  updateIndex(name: ID!, index: CreateIndexInput!): Operation!
  deleteIndex(name: ID!): Operation!
  upsertDatapoints(input: UpsertDatapointsInput!): UpsertDatapointsResponse!
  removeDatapoints(input: RemoveDatapointsInput!): RemoveDatapointsResponse!

  # Index Endpoints
  createIndexEndpoint(parent: String!, indexEndpoint: CreateIndexEndpointInput!, indexEndpointId: String): Operation!
  updateIndexEndpoint(name: ID!, indexEndpoint: CreateIndexEndpointInput!): IndexEndpoint!
  deleteIndexEndpoint(name: ID!): Operation!
  deployIndex(indexEndpoint: String!, input: DeployIndexInput!): Operation!
  undeployIndex(indexEndpoint: String!, input: UndeployIndexInput!): Operation!
  findNeighbors(input: FindNeighborsInput!): FindNeighborsResponse!

  # Metadata
  createMetadataStore(parent: String!, metadataStore: JSON!, metadataStoreId: String): Operation!
  deleteMetadataStore(name: ID!, force: Boolean): Operation!

  createArtifact(parent: String!, artifact: JSON!, artifactId: String): Artifact!
  updateArtifact(name: ID!, artifact: JSON!): Artifact!
  deleteArtifact(name: ID!, etag: String): Operation!
  purgeArtifacts(parent: String!, filter: String!, force: Boolean): Operation!

  createExecution(parent: String!, execution: JSON!, executionId: String): Execution!
  updateExecution(name: ID!, execution: JSON!): Execution!
  deleteExecution(name: ID!, etag: String): Operation!
  purgeExecutions(parent: String!, filter: String!, force: Boolean): Operation!
  addExecutionEvents(name: ID!, events: [JSON!]!): Boolean!

  createContext(parent: String!, context: JSON!, contextId: String): Context!
  updateContext(name: ID!, context: JSON!): Context!
  deleteContext(name: ID!, force: Boolean, etag: String): Operation!
  purgeContexts(parent: String!, filter: String!, force: Boolean): Operation!
  addContextArtifactsAndExecutions(context: String!, artifacts: [String], executions: [String]): Boolean!
  addContextChildren(context: String!, childContexts: [String!]!): Boolean!
  removeContextChildren(context: String!, childContexts: [String!]!): Boolean!

  # Schedules
  createSchedule(parent: String!, schedule: CreateScheduleInput!): Schedule!
  updateSchedule(name: ID!, schedule: CreateScheduleInput!): Schedule!
  deleteSchedule(name: ID!): Operation!
  pauseSchedule(name: ID!): Boolean!
  resumeSchedule(name: ID!, catchUp: Boolean): Boolean!

  # Tensorboard
  createTensorboard(parent: String!, tensorboard: JSON!): Operation!
  updateTensorboard(name: ID!, tensorboard: JSON!): Operation!
  deleteTensorboard(name: ID!): Operation!

  createTensorboardExperiment(parent: String!, experiment: JSON!, tensorboardExperimentId: String): TensorboardExperiment!
  updateTensorboardExperiment(name: ID!, experiment: JSON!): TensorboardExperiment!
  deleteTensorboardExperiment(name: ID!): Operation!

  createTensorboardRun(parent: String!, run: JSON!, tensorboardRunId: String): TensorboardRun!
  batchCreateTensorboardRuns(parent: String!, requests: [JSON!]!): [TensorboardRun]
  updateTensorboardRun(name: ID!, run: JSON!): TensorboardRun!
  deleteTensorboardRun(name: ID!): Operation!
  writeTensorboardRunData(tensorboardRun: String!, timeSeriesData: [JSON!]!): Boolean!

  # Model Garden / Generative AI
  generateContent(input: GenerateContentInput!): GenerateContentResponse!
  streamGenerateContent(input: GenerateContentInput!): GenerateContentResponse!
  embedContent(input: EmbedContentInput!): EmbedContentResponse!
  batchEmbedContents(model: String!, requests: [EmbedContentInput!]!): [EmbedContentResponse]

  # Operations
  cancelOperation(name: ID!): Boolean!
  deleteOperation(name: ID!): Boolean!
  waitOperation(name: ID!, timeout: String): Operation!
}

# ---------------------------------------------------------------------------
# Subscription Root
# ---------------------------------------------------------------------------

type Subscription {
  # Job state changes
  customJobStateChanged(name: ID!): CustomJob!
  batchPredictionJobStateChanged(name: ID!): BatchPredictionJob!
  trainingPipelineStateChanged(name: ID!): TrainingPipeline!
  pipelineJobStateChanged(name: ID!): PipelineJob!
  hyperparameterTuningJobStateChanged(name: ID!): HyperparameterTuningJob!
  nasJobStateChanged(name: ID!): NasJob!

  # Operation completion
  operationCompleted(name: ID!): Operation!

  # Model deployment events
  modelDeployed(endpointName: String!): DeployedModel!
  modelUndeployed(endpointName: String!): String!

  # Feature view sync
  featureViewSyncCompleted(featureViewName: String!): FeatureView!

  # Index update
  indexUpdated(indexName: String!): Index!

  # Tensorboard data streaming
  tensorboardRunDataWritten(tensorboardRunName: String!): JSON!

  # Pipeline task updates
  pipelineTaskStateChanged(pipelineJobName: ID!): PipelineTaskDetail!

  # Experiment run updates
  experimentRunStateChanged(experimentRunName: ID!): ExperimentRun!
}

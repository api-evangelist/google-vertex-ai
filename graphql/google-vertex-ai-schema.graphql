"""
Google Vertex AI GraphQL Schema
Derived from the Google Vertex AI REST/gRPC API surface.
Covers model training, deployment, AutoML, feature store, model registry,
pipelines, experiments, and Model Garden (Gemini, PaLM, Imagen).
"""

# ---------------------------------------------------------------------------
# Scalars
# ---------------------------------------------------------------------------

scalar DateTime
scalar JSON
scalar Long
scalar Float64

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

